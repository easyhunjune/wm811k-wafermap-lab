[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wm811k-wafermap-lab"
version = "0.1.0"
description = "Leakage-aware WM-811K wafer-map classification project"
readme = "README.md"
requires-python = ">=3.10,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

